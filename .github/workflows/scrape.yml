name: Daily NBA Stats Scraper

on:
  schedule:
    # Her gün 06:00 UTC (Türkiye 09:00)
    - cron: '0 6 * * *'
  
  # Manuel çalıştırma için
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repo
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        pip install requests beautifulsoup4
    
    - name: Run scraper
      run: python scraper.py
    
    - name: Check if teams.json changed
      id: verify-changed-files
      run: |
        if [ -f teams.json ]; then
          echo "changed=true" >> $GITHUB_OUTPUT
        else
          echo "changed=false" >> $GITHUB_OUTPUT
        fi
    
    - name: Commit and push if changed
      if: steps.verify-changed-files.outputs.changed == 'true'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add teams.json
        git diff --staged --quiet || (git commit -m "Update NBA stats - $(date +%Y-%m-%d)" && git push)
